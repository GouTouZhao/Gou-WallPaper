[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gou-wallpaper"
version = "1.0.0"
description = "Gou Wallpaper - Modern Windows Wallpaper & Native Screensaver Manager"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Gou Wallpaper Team"}
]
dependencies = [
    "PySide6-Essentials>=6.6.0",
    "Pillow>=10.0.0",
    "comtypes>=1.4.0",
    "pywin32>=306",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
